name: GearBeacon CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'

      - name: Verify version consistency
        run: node scripts/check-versions.mjs

      - name: Compile backend
        run: npx --yes -p typescript@5.8.3 tsc -p backend/tsconfig.json

      - name: Check browser JavaScript
        run: node --check web/app.js

      - name: Run GearBeacon self-test
        run: node --no-warnings scripts/self-test.mjs

      - name: Build Docker image
        run: docker build -t gearbeacon:test .
