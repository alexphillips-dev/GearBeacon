name: Live catalog canary

on:
  schedule:
    - cron: '17 13 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-catalog-canary
  cancel-in-progress: false

jobs:
  live-catalog:
    name: Read-only regional catalog validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate live US, Canada, EU, and UK catalogs
        run: npm run test:live-catalog
      - name: Report canary failure
        if: failure()
        run: |
          echo '### Live catalog canary failed' >> "$GITHUB_STEP_SUMMARY"
          echo 'At least one read-only regional catalog check failed. No watchlist items or notifications were created.' >> "$GITHUB_STEP_SUMMARY"
