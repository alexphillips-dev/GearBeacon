name: GearBeacon Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'

      - name: Verify tag matches app version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION=$(node -p "require('./backend/package.json').version")
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match backend/package.json $APP_VERSION"
            exit 1
          fi

      - name: Verify version consistency
        run: node scripts/check-versions.mjs

      - name: Compile backend
        run: npx --yes -p typescript@5.8.3 tsc -p backend/tsconfig.json

      - name: Run self-test
        run: node --no-warnings scripts/self-test.mjs

      - name: Build release archive
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="GearBeacon-v${VERSION}"
          mkdir -p "$STAGE"
          rsync -a ./ "$STAGE/" \
            --exclude '.git' \
            --exclude '.github/workflows' \
            --exclude 'node_modules' \
            --exclude "$STAGE" \
            --exclude '*.zip' \
            --exclude '*.sha256.txt'
          zip -qr "GearBeacon-v${VERSION}.zip" "$STAGE"
          sha256sum "GearBeacon-v${VERSION}.zip" > "GearBeacon-v${VERSION}.sha256.txt"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "GearBeacon-v${VERSION}.zip" \
            "GearBeacon-v${VERSION}.sha256.txt" \
            --title "GearBeacon V${VERSION}" \
            --generate-notes

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate container metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/gearbeacon
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Publish multi-platform container
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
