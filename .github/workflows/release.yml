name: GearBeacon Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write
  actions: read
  id-token: write
  attestations: write

jobs:
  preflight:
    name: Release policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - name: Verify tag, manifest, changelog, and source branch
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          BASE_VERSION="${TAG_VERSION%%[-+]*}"
          APP_VERSION=$(node -p "require('./backend/package.json').version")
          test "$BASE_VERSION" = "$APP_VERSION" || { echo "Tag $GITHUB_REF_NAME does not match application V$APP_VERSION." >&2; exit 1; }
          npm run build
          npm run check
          grep -Fq "## V${APP_VERSION} " CHANGELOG.md || { echo "CHANGELOG.md has no V${APP_VERSION} entry." >&2; exit 1; }
          node -e "const m=require('./release-manifest.json'); if (!m.releaseNotes?.trim()) throw new Error('Release notes are empty')"
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then TARGET=dev; else TARGET=main; fi
          git fetch --no-tags origin "$TARGET"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$TARGET" || { echo "$GITHUB_REF_NAME must point to a commit on $TARGET." >&2; exit 1; }
      - name: Require successful CI and security checks at this commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for WORKFLOW in ci.yml security.yml; do
            CONCLUSION=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW/runs?head_sha=$GITHUB_SHA&per_page=30" --jq '[.workflow_runs[] | select(.event == "push")][0].conclusion // "missing"')
            test "$CONCLUSION" = success || { echo "$WORKFLOW is not successful at $GITHUB_SHA (found: $CONCLUSION)." >&2; exit 1; }
          done

  package:
    needs: preflight
    uses: ./.github/workflows/package.yml
    with:
      package_version: ${{ github.ref_name }}

  release:
    name: Publish verified release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: standalone-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: source
          path: release-assets
      - name: Verify packaged checksums
        shell: bash
        run: |
          for CHECKSUM in release-assets/*.sha256; do
            (cd release-assets && sha256sum -c "$(basename "$CHECKSUM")")
          done
      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          PRERELEASE=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then PRERELEASE=(--prerelease); fi
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft >/tmp/gearbeacon-release-state 2>/dev/null; then
            test "$(cat /tmp/gearbeacon-release-state)" = true || { echo 'A published release already exists for this tag.' >&2; exit 1; }
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --draft --title "GearBeacon V${GITHUB_REF_NAME#v}" --generate-notes "${PRERELEASE[@]}"
          fi
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate container metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/gearbeacon
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Publish amd64 and arm64 container
        id: container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
            IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/gearbeacon
      - name: Attest published container
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/gearbeacon
          subject-digest: ${{ steps.container.outputs.digest }}
          push-to-registry: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
