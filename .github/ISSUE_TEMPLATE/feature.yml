name: Feature request
description: Propose a focused improvement for private, self-hosted GearBeacon installations.
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user need rather than only the proposed interface.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Project fit
      options:
        - label: This preserves private, self-hosted operation without requiring a GearBeacon cloud account.
          required: true
