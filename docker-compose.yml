services:
  gearbeacon:
    build: .
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      REGION: "us"
      POLL_SECONDS: "60"
      GEARBEACON_DEPLOYMENT: "cloud"
      GEARBEACON_DATA_DIR: "/data"
      # GEARBEACON_PUBLIC_BASE_URL: "https://gearbeacon.example.com"
      # NTFY_TOPIC: ""
      # DISCORD_WEBHOOK_URL: ""
    volumes:
      - gearbeacon-data:/data

volumes:
  gearbeacon-data:
